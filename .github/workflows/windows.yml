name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S windows -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release --parallel
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\PhoneCam.iss'
      - name: Upload Windows build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phonecam-windows-x64
          path: |
            build/windows/Release/PhoneCam.exe
            windows/installer/output/PhoneCamSetup.exe
