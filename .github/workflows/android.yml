name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK to release
        if: github.event_name != 'pull_request'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.sha }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PhoneCam-android-debug.apk
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "PhoneCam build ${{ github.run_number }}" --notes "Automated build from commit ${{ github.sha }}"
          gh release upload "$TAG" PhoneCam-android-debug.apk --clobber
